<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWBH Dev Editor</title>
<style>
:root{--bg:#050810;--panel:#0a0f1e;--border:#1a2a4a;--accent:#00f0ff;--danger:#ff3a3a;--warning:#ffaa00;--green:#00ff88;--text:#c8deff;--muted:#4a6080;--mob:#ff6b35;--boss:#ff1a6e;--font-mono:'Courier New',monospace;--font-hud:'Arial',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-mono);overflow:hidden;font-size:12px}

/* ── 整體佈局 ── */
#app{display:flex;flex-direction:column;height:100vh}
#header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(10,15,30,.97);border-bottom:1px solid var(--border);flex-shrink:0}
#header h1{font-family:var(--font-hud);font-size:13px;font-weight:900;color:var(--accent);letter-spacing:3px}
.hdr-sep{width:1px;height:20px;background:var(--border)}
.hdr-btn{font-family:var(--font-hud);font-size:9px;font-weight:700;letter-spacing:2px;padding:6px 12px;border-radius:3px;cursor:pointer;border:1px solid;transition:all .2s}
.hdr-btn-save{color:var(--green);border-color:rgba(0,255,136,.5);background:rgba(0,255,136,.08)}
.hdr-btn-save:hover{background:rgba(0,255,136,.22)}
.hdr-btn-load{color:var(--warning);border-color:rgba(255,170,0,.5);background:rgba(255,170,0,.08)}
.hdr-btn-load:hover{background:rgba(255,170,0,.22)}
.hdr-btn-apply{color:var(--accent);border-color:rgba(0,240,255,.5);background:rgba(0,240,255,.08)}
.hdr-btn-apply:hover{background:rgba(0,240,255,.22)}
.hdr-btn-apply:disabled{opacity:.4;cursor:not-allowed}
#hdr-status{margin-left:auto;font-size:9px;color:var(--muted);letter-spacing:1px}

#main{display:flex;flex:1;overflow:hidden}

/* ── 左側：地點列表 ── */
#sidebar{width:200px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar-title{font-family:var(--font-hud);font-size:9px;color:var(--accent);letter-spacing:2px;padding:10px 12px;border-bottom:1px solid var(--border)}
#poi-list{flex:1;overflow-y:auto;padding:6px}
#poi-list::-webkit-scrollbar{width:3px}
#poi-list::-webkit-scrollbar-thumb{background:var(--border)}
.poi-item{padding:7px 10px;border-radius:3px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all .15s}
.poi-item:hover{background:rgba(0,240,255,.06);border-color:var(--border)}
.poi-item.selected{background:rgba(0,240,255,.12);border-color:rgba(0,240,255,.4)}
.poi-item .pi-badge{font-size:8px;font-family:var(--font-hud);letter-spacing:1px;margin-bottom:2px}
.poi-item .pi-badge.boss{color:var(--boss)}
.poi-item .pi-badge.mob{color:var(--mob)}
.poi-item .pi-name{font-size:10px;color:var(--text)}

/* ── 中央：編輯器標籤頁 ── */
#editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tab-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);background:rgba(5,8,16,.6);flex-shrink:0}
.tab-btn{font-family:var(--font-hud);font-size:8px;font-weight:700;letter-spacing:1px;padding:5px 10px;border-radius:3px;cursor:pointer;border:1px solid transparent;color:var(--muted);background:transparent;transition:all .15s}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab-btn.active{color:var(--accent);border-color:rgba(0,240,255,.4);background:rgba(0,240,255,.1)}
#tab-content{flex:1;overflow-y:auto;padding:14px;overflow-x:hidden}
#tab-content::-webkit-scrollbar{width:4px}
#tab-content::-webkit-scrollbar-thumb{background:var(--border)}

/* ── 右側：預覽 Canvas ── */
#preview-panel{width:340px;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#preview-title{font-family:var(--font-hud);font-size:9px;color:var(--accent);letter-spacing:2px;padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#preview-canvas{width:100%;flex:1;display:block;cursor:crosshair}
#preview-info{font-size:9px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--border);display:flex;gap:14px}

/* ── 編輯器通用元素 ── */
.section-title{font-family:var(--font-hud);font-size:10px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.form-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.form-label{font-size:9px;color:var(--muted);letter-spacing:1px;min-width:100px;text-transform:uppercase}
.form-input{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:5px 8px;border-radius:3px;flex:1;transition:border-color .2s}
.form-input:focus{outline:none;border-color:rgba(0,240,255,.5)}
.form-input[type=color]{padding:2px 4px;height:28px;cursor:pointer;width:60px;flex:none}
.form-input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-size:10px;color:var(--text);min-width:36px;text-align:right}
.form-select{background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:5px 8px;border-radius:3px;flex:1}
.form-select option{background:#0a0f1e}
.form-check{display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer}
.form-check input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}

.ed-btn{font-family:var(--font-hud);font-size:9px;font-weight:700;letter-spacing:2px;padding:6px 12px;border-radius:3px;cursor:pointer;border:1px solid;transition:all .2s}
.ed-btn-accent{color:var(--accent);border-color:rgba(0,240,255,.5);background:rgba(0,240,255,.08)}
.ed-btn-accent:hover{background:rgba(0,240,255,.2)}
.ed-btn-danger{color:var(--danger);border-color:rgba(255,58,58,.5);background:rgba(255,58,58,.06)}
.ed-btn-danger:hover{background:rgba(255,58,58,.18)}
.ed-btn-warn{color:var(--warning);border-color:rgba(255,170,0,.5);background:rgba(255,170,0,.08)}
.ed-btn-warn:hover{background:rgba(255,170,0,.2)}
.ed-btn-green{color:var(--green);border-color:rgba(0,255,136,.5);background:rgba(0,255,136,.08)}
.ed-btn-green:hover{background:rgba(0,255,136,.2)}

/* Phase 卡片 */
.phase-card{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px}
.phase-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.phase-label{font-family:var(--font-hud);font-size:9px;color:var(--warning);letter-spacing:2px}

/* 武器卡片 */
.weapon-card{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.weapon-card.custom-w{border-color:rgba(0,240,255,.2)}
.weapon-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.weapon-info{flex:1}
.weapon-name{font-size:11px;color:var(--text);margin-bottom:2px}
.weapon-stats{font-size:9px;color:var(--muted)}
.weapon-actions{display:flex;gap:4px}

/* 威脅等級選擇 */
.threat-tabs{display:flex;gap:4px;margin-bottom:12px}
.threat-tab{padding:5px 12px;border-radius:3px;cursor:pointer;border:1px solid var(--border);font-size:9px;font-family:var(--font-hud);color:var(--muted);background:transparent;transition:all .15s}
.threat-tab.active{color:var(--boss);border-color:rgba(255,26,110,.5);background:rgba(255,26,110,.1)}

/* POI 類別表格 */
.world-table{width:100%;border-collapse:collapse;font-size:10px}
.world-table th{text-align:left;padding:5px 8px;background:rgba(0,0,0,.3);color:var(--muted);font-weight:normal;font-family:var(--font-hud);font-size:8px;letter-spacing:1px;border:1px solid var(--border)}
.world-table td{padding:4px 8px;border:1px solid rgba(26,42,74,.5)}
.world-table tr:hover td{background:rgba(0,240,255,.04)}
.world-table input,.world-table select{background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:10px;width:100%;outline:none}

/* 音效行 */
.sfx-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(26,42,74,.4)}
.sfx-name{min-width:110px;font-size:9px;color:var(--muted)}
.sfx-play{font-size:10px;padding:3px 8px;cursor:pointer;border-radius:2px;border:1px solid rgba(0,240,255,.4);background:rgba(0,240,255,.06);color:var(--accent)}

/* 信息盒 */
.info-box{background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.2);border-radius:4px;padding:10px;margin-bottom:12px;font-size:9px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div id="app">

<!-- ── Header ── -->
<div id="header">
  <h1>⚙ RWBH DEV EDITOR</h1>
  <div class="hdr-sep"></div>
  <button class="hdr-btn hdr-btn-load"  onclick="APP.loadFromFile()">📂 載入設計</button>
  <button class="hdr-btn hdr-btn-save"  onclick="APP.saveLocal()">💾 儲存</button>
  <button class="hdr-btn hdr-btn-save"  onclick="APP.downloadDesign()" style="background:rgba(0,240,255,.06)">📥 匯出</button>
  <div class="hdr-sep"></div>
  <button class="hdr-btn hdr-btn-apply" id="btn-apply-server" onclick="APP.applyToServer()">🚀 上傳到伺服器</button>
  <span id="hdr-status">選擇左側地點開始設計</span>
</div>

<div id="main">

<!-- ── 左側地點列表 ── -->
<div id="sidebar">
  <div id="sidebar-title">範例地點</div>
  <div id="poi-list"></div>
</div>

<!-- ── 中央編輯器 ── -->
<div id="editor">
  <div id="tab-bar">
    <button class="tab-btn active" onclick="APP.switchTab('enemy_data',this)">敵人數據</button>
    <button class="tab-btn" onclick="APP.switchTab('weapon',this)">武器管理</button>
    <button class="tab-btn" onclick="APP.switchTab('player_data',this)">玩家數據</button>
    <button class="tab-btn" onclick="APP.switchTab('balance',this)">遊戲平衡</button>
    <button class="tab-btn" onclick="APP.switchTab('world',this)">地圖規則</button>
    <button class="tab-btn" onclick="APP.switchTab('lore',this)">故事文案</button>
    <button class="tab-btn" onclick="APP.switchTab('sfx',this)">音效</button>
    <button class="tab-btn" onclick="APP.switchTab('vfx',this)">視覺特效</button>
    <button class="tab-btn" onclick="APP.switchTab('theme',this)">HUD 主題</button>
    <button class="tab-btn" onclick="APP.switchTab('apply',this)">套用選擇</button>
    <button class="tab-btn" onclick="APP.switchTab('ui_panels',this)">UI 面板</button>
    <button class="tab-btn" onclick="APP.switchTab('relic',this)">奇物設計</button>
  </div>
  <div id="tab-content">
    <div style="color:var(--muted);text-align:center;margin-top:40px;font-size:11px">← 請先在左側選擇一個範例地點</div>
  </div>
</div>

<!-- ── 右側預覽 ── -->
<div id="preview-panel">
  <div id="preview-title">
    <span>戰鬥預覽</span>
    <span style="font-size:8px;color:var(--muted);letter-spacing:0">按住滑鼠射擊 ｜ 彈幕Tab拖移箭頭調角度</span>
    <button class="ed-btn ed-btn-accent" style="font-size:8px;padding:4px 8px" onclick="PREVIEW.toggle()">▶ 開始</button>
  </div>
  <canvas id="preview-canvas"></canvas>
  <div id="preview-info">
    <span id="pv-fps">FPS: —</span>
    <span id="pv-bullets">子彈: 0</span>
    <span id="pv-hp">Boss HP: —</span>
  </div>
</div>

</div><!-- #main -->
</div><!-- #app -->

<!-- 隱藏 file input -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script src="dev_data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  設計資料狀態
// ═══════════════════════════════════════════════════════════════
const DESIGN = {
  patterns:  JSON.parse(JSON.stringify(DEV_DEFAULT_PATTERNS)),
  visuals:   JSON.parse(JSON.stringify(DEV_DEFAULT_VISUALS)),
  weapons:   JSON.parse(JSON.stringify(DEV_DEFAULT_WEAPONS)),
  mechanics: JSON.parse(JSON.stringify(DEV_DEFAULT_MECHANICS)),
  abilities: { boss_abilities:{}, mob_abilities:{} },
  balance:   JSON.parse(JSON.stringify(DEV_DEFAULT_BALANCE)),
  world:     JSON.parse(JSON.stringify(DEV_DEFAULT_WORLD)),
  lore:      JSON.parse(JSON.stringify(DEV_DEFAULT_LORE)),
  mob_counts: {1:3,2:4,3:3,4:4,5:5},
  custom_pois: [],
  sfx:{}, vfx:{},
  theme:{ vars:{'--accent':'#00f0ff','--boss':'#ff1a6e','--mob':'#ff6b35','--warning':'#ffaa00','--green':'#00ff88','--danger':'#ff3a3a','--bg':'#050810','--panel':'#0a0f1e','--text':'#c8deff','--muted':'#4a6080'}},
  relics: {
    iron_core:     { name:'鐵核',     icon:'⬡', color:'#aaaaaa', bonus:{ atk_mult:1.25, max_hp_bonus:0,  fire_rate_mult:1    }, drop_threat_min:3, drop_rate:0.40 },
    crimson_shard: { name:'赤晶碎片', icon:'◈', color:'#ff4444', bonus:{ atk_mult:1.50, max_hp_bonus:0,  fire_rate_mult:0.90 }, drop_threat_min:4, drop_rate:0.25 },
    vitality_core: { name:'活力核',   icon:'♥', color:'#00ff88', bonus:{ atk_mult:1,    max_hp_bonus:30, fire_rate_mult:1    }, drop_threat_min:2, drop_rate:0.50 },
    rapid_crystal: { name:'速射結晶', icon:'⚡', color:'#ffee00', bonus:{ atk_mult:1,    max_hp_bonus:0,  fire_rate_mult:0.75 }, drop_threat_min:3, drop_rate:0.30 },
    shadow_eye:    { name:'暗影之眼', icon:'◉', color:'#aa44ff', bonus:{ atk_mult:1.35, max_hp_bonus:10, fire_rate_mult:0.85 }, drop_threat_min:5, drop_rate:0.15 },
  },
  server_assignments:{
    patterns:true, visuals:true, weapons:true, mechanics:false,
    abilities:false, balance:true, world:false, lore:false, sfx:false, vfx:false, theme:false,
    relics:true,
  },
};

let currentPoi    = null;
let currentTab    = 'enemy_data';
let currentThreat = 1;
let currentEnemyType     = 'mob';
let currentEnemyExpanded = null;

// ═══════════════════════════════════════════════════════════════
//  APP 控制器
// ═══════════════════════════════════════════════════════════════
const APP = {
  init() {
    // 渲染地點列表
    const list = document.getElementById('poi-list');
    DEV_POIS.forEach(poi => {
      const el = document.createElement('div');
      el.className = 'poi-item';
      el.dataset.id = poi.id;
      el.innerHTML = `<div class="pi-badge ${poi.type}">${poi.type.toUpperCase()} Lv.${poi.threat}</div><div class="pi-name">${poi.name}</div>`;
      el.onclick = () => this.selectPoi(poi);
      list.appendChild(el);
    });

    // 嘗試從 localStorage 載入
    const saved = localStorage.getItem('rwbh_design');
    if (saved) {
      try { Object.assign(DESIGN, JSON.parse(saved)); this.status('已從 localStorage 還原設計'); } catch(_) {}
    }

    // 初始化預覽
    PREVIEW.init();
    // 初始渲染
    this.renderTab('enemy_data');
  },

  selectPoi(poi) {
    currentPoi = poi;
    currentThreat = poi.threat;
    document.querySelectorAll('.poi-item').forEach(el => el.classList.remove('selected'));
    document.querySelector(`[data-id="${poi.id}"]`)?.classList.add('selected');
    this.status(`已選擇：${poi.name}`);
    this.renderTab(currentTab);
    PREVIEW.loadPoi(poi);
  },

  switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    this.renderTab(tab);
  },

  renderTab(tab) {
    const el = document.getElementById('tab-content');
    const poi = currentPoi;

    switch(tab) {
      case 'weapon':    el.innerHTML = TABS.weapon();     break;
      case 'mechanics':
      case 'player_data':  el.innerHTML = TABS.player_data(); break;
      case 'abilities':
      case 'enemy_data':   el.innerHTML = TABS.enemy_data(); break;
      case 'balance':   el.innerHTML = TABS.balance();    break;
      case 'world':     el.innerHTML = TABS.world();      break;
      case 'lore':      el.innerHTML = TABS.lore();       break;
      case 'sfx':       el.innerHTML = TABS.sfx();        break;
      case 'vfx':       el.innerHTML = TABS.vfx();        break;
      case 'theme':     el.innerHTML = TABS.theme();      break;
      case 'apply':     el.innerHTML = TABS.apply();      break;
      case 'ui_panels': el.innerHTML = TABS.ui_panels();  break;
      case 'relic':     el.innerHTML = TABS.relic();      break;
      default:          el.innerHTML = '<div>開發中...</div>';
    }
  },

  saveToFile() { this.saveLocal(); },
  saveLocal() {
    localStorage.setItem('rwbh_design', JSON.stringify(DESIGN));
    this.status('✓ 已儲存到瀏覽器');
  },
  downloadDesign() {
    const blob = new Blob([JSON.stringify(DESIGN, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'rwbh_design.json'; a.click();
    this.status('✓ 設計已匯出');
  },
  previewPoiById(id) {
    const all=[...DEV_POIS,...(DESIGN.custom_pois||[])];
    const poi=all.find(p=>p.id===id);
    if(poi){ PREVIEW.loadPoi(poi); if(!PREVIEW.running) PREVIEW.start(); }
  },

  loadFromFile() {
    document.getElementById('file-input').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          Object.assign(DESIGN, data);
          localStorage.setItem('rwbh_design', JSON.stringify(DESIGN));
          this.renderTab(currentTab);
          this.status('✓ 設計已載入');
        } catch(_) { this.status('✗ 檔案格式錯誤'); }
      };
      reader.readAsText(f);
    };
    document.getElementById('file-input').click();
  },

  async applyToServer() {
    const serverUrl = prompt('Flask 伺服器位址（預設 http://localhost:5000）:', 'http://localhost:5000');
    if (!serverUrl) return;
    const payload = {};
    Object.keys(DESIGN.server_assignments).forEach(key => {
      if (DESIGN.server_assignments[key]) payload[key] = DESIGN[key];
    });
    // ui_layout 永遠包含（若存在）
    if (DESIGN.ui_layout && Object.keys(DESIGN.ui_layout).length > 0) {
      payload['ui_layout'] = DESIGN.ui_layout;
    }
    try {
      const resp = await fetch(`${serverUrl}/api/dev/import`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      this.status(data.ok ? `✓ 已套用：${data.written.join(', ')}` : '✗ 套用失敗');
    } catch(e) { this.status('✗ 無法連線到伺服器'); }
  },

  status(msg) { document.getElementById('hdr-status').textContent = msg; },
};

// ═══════════════════════════════════════════════════════════════
//  各分頁 HTML 生成
// ═══════════════════════════════════════════════════════════════
const TABS = {

  // ── (pattern & visual merged into enemy_data — kept for JS validity, never called) ─
  pattern(poi) {
    const key = `threat_${poi?.threat||1}`;
    const phases = DESIGN.patterns[key] || [];
    const movementType = DESIGN.visuals?.boss_movement?.[poi?.threat]?.type || 'wobble';
    const MOVE_LABELS = {wobble:'正弦擺動',circular:'圓形軌道',figure8:'8字形',track_player_x:'跟隨X軸',static:'固定靜止'};
    return `
      <div class="section-title">⚡ 彈幕 Pattern — ${poi.name} (威脅 Lv.${poi.threat})</div>
      <div class="info-box">Phase 依 HP 閾值從高到低排列。Boss HP 低於閾值時啟動對應 Phase。</div>

      <!-- 全域控制 -->
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        <button class="ed-btn ed-btn-warn" style="font-size:8px;padding:3px 8px"
          onclick="PREVIEW.setForcedPhase(-1)">▶ 自動預覽（依HP）</button>
        <button class="ed-btn" style="font-size:8px;padding:3px 8px;color:var(--danger);border-color:rgba(255,58,58,.4);background:rgba(255,58,58,.06)"
          onclick="PREVIEW.playerHp=PREVIEW.playerMaxHp;PREVIEW.damageNumbers=[];APP.status('玩家 HP 已重置')">重置玩家 HP</button>
      </div>

      ${phases.map((p,i) => {
        const phaseMove = p.movement_type || movementType;
        return `
        <div class="phase-card">
          <div class="phase-header">

  weapon() {
    const DEFAULT_IDS = ['pulse_gun','twin','scatter','rapid','seeker'];
    const PATTERNS = ['single','twin','spread_5','rapid','seek'];
    const PATTERN_LABELS = {single:'單發',twin:'雙管',spread_5:'散射',rapid:'速射',seek:'追蹤'};
    const weapons    = DESIGN.weapons;
    const deletedSet = new Set(DESIGN.world?._deleted_weapons || []);
    const editing    = ED._editingWeaponId;

    const weaponCards = Object.entries(weapons).map(([id, w]) => {

            <span class="range-val">${w.fire_rate}</span></div>
          <div class="form-row"><label class="form-label" style="min-width:80px">價格(結晶)</label>

              oninput="this.nextElementSibling.textContent=this.value">
            <span class="range-val">${w.price}</span></div>

          <div class="form-row"><label class="form-label" style="min-width:80px">拖尾倍率</label>

          <div class="form-row"><label class="form-label" style="min-width:80px">射擊模式</label>
            <select class="form-select" id="we-pattern">

          <div class="form-row"><label class="form-label" style="min-width:80px">武器類型</label>
            <select class="form-select" id="we-type" onchange="document.getElementById('we-subpos-row').style.display=this.value==='sub'?'':'none'">

          <div id="we-subpos-row" style="${w.type==='sub'?'':'display:none'}">
            <div class="form-row"><label class="form-label" style="min-width:80px">裝備位置</label>
              <select class="form-select" id="we-pos-type">
                <option value="angle"      ${(w.sub_position?.type||'angle')==='angle'?'selected':''}>自訂角度</option>
                <option value="both_sides" ${w.sub_position?.type==='both_sides'?'selected':''}>左右雙側</option>

            <div class="form-row"><label class="form-label" style="min-width:80px">角度 (°)</label>
              <input type="range" class="form-input" id="we-pos-angle" min="-180" max="180" step="15" value="${w.sub_position?.angle??90}"

      return `

            <div class="weapon-info" style="flex:1">

              <div class="weapon-stats">ATK:${w.damage} INT:${w.fire_rate}f ◈${w.price} 子彈r:${w.bullet_r||'—'} 模式:${PATTERN_LABELS[w.pattern]||w.pattern}</div>

    return `

      <div style="margin-bottom:10px">
        <button class="ed-btn ed-btn-accent" onclick="ED.addWeapon()">+ 新增自訂武器</button>
      </div>
      ${weaponCards}
    `;
  },

  // ── 玩家數據 ──────────────────────────────────────────────────
  player_data() {
    const p = DESIGN.mechanics.player;
    function row(label, key, min, max, step, unit='') {
      const val = p[key] ?? 0;
      return `<div class="form-row"><label class="form-label">${label}</label>
        <input type="range" class="form-input" min="${min}" max="${max}" step="${step||1}" value="${val}"
          oninput="DESIGN.mechanics.player['${key}']=+this.value;this.nextElementSibling.textContent=this.value+'${unit}'">
        <span class="range-val">${val}${unit}</span></div>`;
    }
    return `
      <div class="section-title">🧬 玩家數據</div>
      ${row('最大血量',        'max_hp',          50,  500,  1)}
      ${row('移動速度',        'move_smoothing',  0.03, 0.5, 0.01)}
      ${row('基礎攻擊',        'base_atk',        1,   200,  1)}
      ${row('射速（間隔幀）',  'fire_rate',        1,    60,  1, 'f')}
      ${row('無敵幀數',        'inv_frames',      10,  240,  1, 'f')}
      ${row('碰撞半徑',        'player_radius',    2,   20,  1, 'px')}
      ${row('子彈速度倍率',    'bullet_speed_mult',0.1,  5, 0.1, '×')}
      ${row('傷害減免',        'damage_reduction', 0,   80,  1, '%')}
      ${row('初始結晶',        'start_crystals',   0, 1000, 10)}
      <hr style="border-color:var(--border);margin:12px 0">
      <button class="ed-btn ed-btn-green" onclick="PREVIEW.restart()">▶ 更新預覽</button>
    `;
  },

    const _ss=(arr,vt,th)=>arr.map((ss,si)=>`

          <span class="range-val">${ss.offset_x||0}px</span></div>
        <div class="form-row"><label class="form-label" style="min-width:60px">Y 位移</label>

    const allPois=[...DEV_POIS,...DESIGN.custom_pois];
    const list=allPois.filter(p=>p.type===eType);

    const cards=list.map(poi=>{
      const isExp=expId===poi.id, t=poi.threat, key=`threat_${t}`;

      const hdr=`<div style="display:flex;align-items:center;gap:8px;width:100%;cursor:pointer" onclick="${hdrClick}">
        <div class="pi-badge ${eType}">${eType.toUpperCase()} Lv.${t}</div>
        <div style="flex:1;font-size:11px;color:var(--text)">${poi.name}</div>

        <button class="ed-btn ed-btn-accent" style="font-size:8px;padding:2px 6px" onclick="event.stopPropagation();APP.previewPoiById('${poi.id}')">▶</button>

        <div class="form-row"><label class="form-label">小怪數量</label>
          <input type="range" class="form-input" min="1" max="15" value="${mc}" oninput="if(!DESIGN.mob_counts)DESIGN.mob_counts={};DESIGN.mob_counts[${t}]=+this.value;this.nextElementSibling.textContent=this.value;PREVIEW.restart()">
          <span class="range-val">${mc}</span></div>
        <div class="form-row"><label class="form-label">名稱前綴</label>
          <input class="form-input" value="${(DESIGN.lore?.mob_prefixes||[])[t-1]||''}" oninput="if(!DESIGN.lore.mob_prefixes)DESIGN.lore.mob_prefixes=[];DESIGN.lore.mob_prefixes[${t-1}]=this.value"></div>
      `:`
        ${isCustom?`<div class="form-row"><label class="form-label">名稱</label><input class="form-input" value="${poi.name}" oninput="DESIGN.custom_pois.find(p=>p.id==='${poi.id}').name=this.value"></div>
        <div class="form-row"><label class="form-label">威脅等級</label><select class="form-select" style="flex:none;width:60px" onchange="DESIGN.custom_pois.find(p=>p.id==='${poi.id}').threat=+this.value;APP.renderTab('enemy_data')">${[1,2,3,4,5].map(lv=>`<option value="${lv}" ${t===lv?'selected':''}>Lv.${lv}</option>`).join('')}</select></div>`:''}
        <div class="form-row"><label class="form-label">Boss 名稱</label>
          <input class="form-input" value="${bossName}" placeholder="未命名 Boss" onchange="if(!DESIGN.lore.boss_names)DESIGN.lore.boss_names=[];DESIGN.lore.boss_names[${t-1}]=this.value"></div>
      `;

      const visualHTML=eType==='mob'?`
        <div class="form-row"><label class="form-label">形狀</label>

          <span class="range-val">${mv.size_multiplier||1.0}</span></div>

          <input type="range" class="form-input" min="10" max="100" value="${bv.glow_intensity||50}" oninput="ED.setVisualBoss(${t},'glow_intensity',+this.value);this.nextElementSibling.textContent=this.value">
          <span class="range-val">${bv.glow_intensity||50}</span></div>
        <div class="form-row"><label class="form-label">大小倍率</label>

      `;

      const phaseCards=phases.map((p,i)=>{
        const pm=p.movement_type||movT;
        return `<div class="phase-card">

  // ── 音效 ──────────────────────────────────────────────────────
  sfx() {
    const EVENTS = [
      ['shoot_single',  '脈衝槍射擊', {freq:1200,freq2:800, dur:0.06,type:'square',  vol:0.04}],
      ['shoot_seeker',  '導彈發射',   {freq:900, freq2:1100,dur:0.08,type:'sine',     vol:0.05}],
      ['enemy_hit',     '敵方受擊',   {freq:380, freq2:200, dur:0.07,type:'sawtooth', vol:0.07}],
      ['player_hit',    '玩家受擊',   {freq:150, freq2:80,  dur:0.2, type:'sine',     vol:0.12}],
      ['phase_change',  'Phase 切換', {freq:220, freq2:440, dur:0.3, type:'square',   vol:0.10}],
      ['victory_note1', '勝利音',     {freq:523, freq2:523, dur:0.18,type:'square',   vol:0.08}],
      ['defeat_note1',  '失敗音',     {freq:400, freq2:280, dur:0.22,type:'sawtooth', vol:0.07}],
    ];
    const sfx = DESIGN.sfx;
    return `
      <div class="section-title">🔊 音效設計</div>
      <div class="info-box">調整滑桿後點「▶ 試聽」即時確認效果。</div>
      ${EVENTS.map(([id, label, def]) => {
        const cur = {...def, ...(sfx[id]||{})};
        return `
          <div class="sfx-row" style="flex-wrap:wrap;gap:4px 8px">
            <span class="sfx-name" style="min-width:70px">${label}</span>
            <span style="font-size:9px;color:var(--muted)">頻率</span>
            <input type="range" data-sfx="${id}-freq" style="width:70px;accent-color:var(--accent)" min="50" max="4000" value="${cur.freq}"

  // ── UI 面板設計器 ─────────────────────────────────────────────
  ui_panels() {
    const layout = DESIGN.ui_layout || {};

    // 預設面板定義
    // 對應主遊戲 PANEL_MGR.registry 的實際浮動面板（商城/背包是 modal，不在此列）
    const PANEL_DEFS = [
      { id: 'scan-panel',  name: '⬡ 掃描面板',     side: 'left',  defaultTop: 82, defaultLeft: 16,  defaultWidth: 260 },
      { id: 'dest-panel',  name: '📍 想前往的地點', side: 'right', defaultTop: 82, defaultRight: 16, defaultWidth: 270 },
      { id: 'stats-panel', name: '📊 遊戲統計',     side: 'left',  defaultTop: 82, defaultLeft: 296, defaultWidth: 220 },
      { id: 'notes-panel', name: '📝 筆記本',       side: 'right', defaultTop: 82, defaultRight: 306, defaultWidth: 220 },
    ];

    if (!DESIGN.ui_layout) DESIGN.ui_layout = {};
    PANEL_DEFS.forEach(def => {
      if (!DESIGN.ui_layout[def.id]) {
        DESIGN.ui_layout[def.id] = {
          top:     def.defaultTop,
          left:    def.side === 'left'  ? def.defaultLeft  : null,
          right:   def.side === 'right' ? def.defaultRight : null,
          width:   def.defaultWidth,
          visible: true,
          collapsed: false,
        };
      }
    });

    const panelForms = PANEL_DEFS.map(def => {
      const s = DESIGN.ui_layout[def.id];
      return `
        <div style="background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px">
          <div style="font-family:var(--font-hud);font-size:10px;color:var(--accent);margin-bottom:10px">${def.name}</div>
          <div class="form-row"><label class="form-label">距頂部 (px)</label>
            <input type="range" class="form-input" min="58" max="600" value="${s.top}"
              oninput="DESIGN.ui_layout['${def.id}'].top=+this.value;this.nextElementSibling.textContent=this.value+'px'">
            <span class="range-val">${s.top}px</span>
          </div>
          ${s.left !== null ? `
          <div class="form-row"><label class="form-label">距左側 (px)</label>
            <input type="range" class="form-input" min="0" max="600" value="${s.left}"
              oninput="DESIGN.ui_layout['${def.id}'].left=+this.value;this.nextElementSibling.textContent=this.value+'px'">
            <span class="range-val">${s.left}px</span>
          </div>` : `
          <div class="form-row"><label class="form-label">距右側 (px)</label>
            <input type="range" class="form-input" min="0" max="600" value="${s.right}"
              oninput="DESIGN.ui_layout['${def.id}'].right=+this.value;this.nextElementSibling.textContent=this.value+'px'">
            <span class="range-val">${s.right}px</span>
          </div>`}
          <div class="form-row"><label class="form-label">寬度 (px)</label>
            <input type="range" class="form-input" min="180" max="500" value="${s.width}"
              oninput="DESIGN.ui_layout['${def.id}'].width=+this.value;this.nextElementSibling.textContent=this.value+'px'">
            <span class="range-val">${s.width}px</span>
          </div>
          <label class="form-check"><input type="checkbox" ${s.visible?'checked':''} onchange="DESIGN.ui_layout['${def.id}'].visible=this.checked">預設顯示</label>
          <label class="form-check"><input type="checkbox" ${s.collapsed?'checked':''} onchange="DESIGN.ui_layout['${def.id}'].collapsed=this.checked">預設折疊</label>
        </div>
      `;
    }).join('');

    // 示意圖：固定寬度 560px，等比縮放高度
    const GAME_W = 1280, GAME_H = 720;
    const PREVIEW_W = 560;
    const sc = PREVIEW_W / GAME_W;
    const PREVIEW_H = Math.round(GAME_H * sc);

    const panelPreviewBoxes = PANEL_DEFS.map(def => {
      const s = DESIGN.ui_layout[def.id];
      if (!s.visible) return '';
      const left = s.left !== null
        ? Math.round(s.left * sc)
        : Math.round((GAME_W - s.width - (s.right || 0)) * sc);
      const top  = Math.round(s.top * sc);
      const w    = Math.round(s.width * sc);
      const h    = Math.round(120 * sc);
      const color = def.side === 'left' ? 'rgba(0,240,255,.15)' : 'rgba(255,170,0,.15)';
      const border = def.side === 'left' ? 'rgba(0,240,255,.5)' : 'rgba(255,170,0,.5)';
      return `<div style="position:absolute;left:${left}px;top:${top}px;width:${w}px;height:${h}px;
        background:${color};border:1px solid ${border};border-radius:2px;
        display:flex;align-items:center;justify-content:center;
        font-size:9px;color:var(--text);text-align:center;padding:2px;overflow:hidden;line-height:1.3">
        ${def.name}<br><span style="font-size:7px;color:var(--muted)">${s.width}px</span>
      </div>`;
    }).join('');

    return `
      <div class="section-title">🖥 UI 面板設計</div>
      <div class="info-box">設定主畫面各面板的預設位置與大小。儲存於 <code>custom_layout.json</code>，主遊戲啟動時套用。<br>
      🟦 左側面板 ／ 🟧 右側面板 ／ 商城・背包為 Modal 彈出層，不在此設定。</div>

      <!-- 示意圖 -->
      <div style="margin-bottom:14px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:6px">版面示意圖（1280×720 縮放至 ${PREVIEW_W}px）</div>
        <div style="position:relative;width:${PREVIEW_W}px;height:${PREVIEW_H}px;background:rgba(5,8,16,.9);border:1px solid var(--border);border-radius:3px;overflow:hidden">
          <!-- 頂部 HUD 條 -->
          <div style="position:absolute;top:0;left:0;right:0;height:${Math.round(56*sc)}px;background:rgba(0,240,255,.07);border-bottom:1px solid rgba(0,240,255,.25);display:flex;align-items:center;padding-left:8px;font-size:8px;color:var(--muted)">HUD 頂部列</div>
          <!-- 地圖區域 -->
          <div style="position:absolute;top:${Math.round(56*sc)}px;left:0;right:0;bottom:${Math.round(48*sc)}px;background:rgba(0,20,40,.4);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(100,150,200,.3)">地圖</div>
          <!-- 底部工具列 -->
          <div style="position:absolute;bottom:0;left:0;right:0;height:${Math.round(48*sc)}px;background:rgba(0,240,255,.05);border-top:1px solid rgba(0,240,255,.15);display:flex;align-items:center;padding-left:8px;font-size:8px;color:var(--muted)">底部工具列</div>
          ${panelPreviewBoxes}
        </div>
      </div>

      ${panelForms}

      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="ed-btn ed-btn-green" onclick="APP.renderTab('ui_panels')">🔄 更新示意圖</button>
        <button class="ed-btn ed-btn-warn" onclick="DESIGN.ui_layout={};APP.renderTab('ui_panels')">↺ 重置預設</button>
      </div>
      <div class="info-box" style="margin-top:10px">
        💡 在主遊戲中，點底部工具列的「⊹ 版面」按鈕可進入即時版面設計模式，直接拖曳調整並自動儲存。
      </div>
    `;
  },

            <span class="range-val">×${r.bonus?.fire_rate_mult||1}</span></div>
          <div class="form-row"><label class="form-label" style="min-width:80px">掉落來源</label>
            <select class="form-select" onchange="DESIGN.relics['${id}'].drop_threat_min=+this.value">
              ${[1,2,3,4,5].map(t=>`<option value="${t}" ${(r.drop_threat_min||1)===t?'selected':''}>Boss 威脅≥${t}</option>`).join('')}
            </select></div>
          <div class="form-row"><label class="form-label" style="min-width:80px">掉落機率</label>
            <input type="range" class="form-input" min="0.05" max="1" step="0.05" value="${r.drop_rate||0.3}"
              oninput="DESIGN.relics['${id}'].drop_rate=+this.value;this.nextElementSibling.textContent=Math.round(this.value*100)+'%'">
            <span class="range-val">${Math.round((r.drop_rate||0.3)*100)}%</span></div>
        </div>
      </div>`).join('');

    return `
      <div class="section-title">◉ 奇物設計</div>
      <div class="info-box">設計 Boss 戰後可掉落的奇物，提供被動加成（攻擊倍率 / 最大 HP / 射速倍率）。掉落機率以 Boss 威脅等級篩選。</div>
      <div style="margin-bottom:10px">
        <button class="ed-btn ed-btn-accent" onclick="ED.addRelic()">+ 新增奇物</button>
      </div>
      ${cards || '<div style="color:var(--muted);text-align:center;padding:20px;font-size:10px">尚無奇物定義</div>'}
    `;
  },
};

  setPhase(key, idx, field, val) {

    PREVIEW.restart();
  },
  addPhase(key) {
    const arr = DESIGN.patterns[key] || [];
    const lastPhase = arr.length ? arr[arr.length-1].phase : 0;
    arr.push({ phase:lastPhase+1, type:'radial', count:8, speed:3.0, hp_threshold: Math.max(0.1, 0.5 - arr.length*0.1), fire_interval:40, damage:10, r:6, color:'#ff1a6e', maxLife:260, trajectory:'straight' });
    DESIGN.patterns[key] = arr;
    APP.renderTab('enemy_data');
  },
  removePhase(key, idx) {
    DESIGN.patterns[key].splice(idx, 1);
    APP.renderTab('enemy_data');
  },
  setVisualBoss(t, field, val) { if(!DESIGN.visuals.boss[t])DESIGN.visuals.boss[t]={}; DESIGN.visuals.boss[t][field]=val; PREVIEW.restart(); },
  setVisualMob(t, field, val)  { if(!DESIGN.visuals.mob[t]) DESIGN.visuals.mob[t]={};  DESIGN.visuals.mob[t][field]=val;  PREVIEW.restart(); },
  setVisualPlayer(field, val)  { DESIGN.visuals.player[field]=val; PREVIEW.restart(); },
  setBossMovement(t, field, val) { if(!DESIGN.visuals.boss_movement)DESIGN.visuals.boss_movement={}; if(!DESIGN.visuals.boss_movement[t])DESIGN.visuals.boss_movement[t]={}; DESIGN.visuals.boss_movement[t][field]=val; },
  setAbility(unit, t, ability, field, val) {
    const section = unit==='boss' ? DESIGN.abilities.boss_abilities : DESIGN.abilities.mob_abilities;
    if (!section[t]) section[t]={};
    if (!section[t][ability]) section[t][ability]={};
    section[t][ability][field]=val;

  },
  addWeapon() {

    DESIGN.weapons[id] = { name:'新武器', description:'自訂武器', damage:15, fire_rate:10, pattern:'single', color:'#aa00ff', price:200, icon:'★', bullet_r:4, bullet_trail_mult:1.0, is_custom:true };
    APP.renderTab('weapon');
    ED._editingWeaponId = id;
    APP.renderTab('weapon');
  },

  _editingWeaponId: null,

  editWeapon(id) {
    // 切換展開/收起
    ED._editingWeaponId = (ED._editingWeaponId === id) ? null : id;
    APP.renderTab('weapon');
  },

  saveWeaponEdit(id) {
    const w = DESIGN.weapons[id];
    if (!w) return;
    const get = (sel) => document.getElementById(sel);
    w.name             = get('we-name')?.value  || w.name;
    w.description      = get('we-desc')?.value  || w.description;
    w.icon             = get('we-icon')?.value  || w.icon;
    w.color            = get('we-color')?.value || w.color;
    w.damage           = +(get('we-dmg')?.value)  || w.damage;
    w.fire_rate        = +(get('we-rate')?.value) || w.fire_rate;
    w.price            = +(get('we-price')?.value)|| w.price;
    w.bullet_r         = +(get('we-br')?.value)   || w.bullet_r;
    w.bullet_trail_mult= +(get('we-trail')?.value)|| w.bullet_trail_mult;
    w.pattern          = get('we-pattern')?.value || w.pattern;
    w.type             = get('we-type')?.value    || w.type || 'main';

      const posType = get('we-pos-type')?.value || 'angle';

    APP.renderTab('weapon');

  deleteWeapon(id) {

  addCustomPoi(type) {

  // ── 奇物 ──────────────────────────────────────────────────────

      bonus:{ atk_mult:1, max_hp_bonus:0, fire_rate_mult:1 },

//  音效預覽

const SFX_PREVIEW = {
  ctx: null,
  play(id) {
    if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    // 直接從 DOM 讀取目前滑桿值，確保反映最新調整
    const freqEl = document.querySelector(`[data-sfx="${id}-freq"]`);
    const volEl  = document.querySelector(`[data-sfx="${id}-vol"]`);
    const typeEl = document.querySelector(`[data-sfx="${id}-type"]`);
    const dur2El = document.querySelector(`[data-sfx="${id}-dur"]`);
    const DEFAULTS = {
      shoot_single:  {freq:1200,freq2:800, dur:0.06,type:'square',  vol:0.04},
      shoot_seeker:  {freq:900, freq2:1100,dur:0.08,type:'sine',     vol:0.05},
      enemy_hit:     {freq:380, freq2:200, dur:0.07,type:'sawtooth', vol:0.07},
      player_hit:    {freq:150, freq2:80,  dur:0.2, type:'sine',     vol:0.12},
      phase_change:  {freq:220, freq2:440, dur:0.3, type:'square',   vol:0.10},
      victory_note1: {freq:523, freq2:523, dur:0.18,type:'square',   vol:0.08},
      defeat_note1:  {freq:400, freq2:280, dur:0.22,type:'sawtooth', vol:0.07},
    };
    const def = DEFAULTS[id] || DEFAULTS.shoot_single;
    const freq = freqEl ? +freqEl.value : def.freq;
    const vol  = volEl  ? +volEl.value  : def.vol;
    const type = typeEl ? typeEl.value  : def.type;
    const dur  = dur2El ? +dur2El.value : def.dur;
    const freq2 = def.freq2;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    if (freq2) osc.frequency.linearRampToValueAtTime(freq2, this.ctx.currentTime + dur);
    const t = this.ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.005);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
};

// ═══════════════════════════════════════════════════════════════
//  戰鬥預覽引擎（簡化版，自含）
// ═══════════════════════════════════════════════════════════════
const PREVIEW = {
  canvas: null, ctx: null, animId: null, running: false,
  poi: null, bossHp: 0, bossMaxHp: 0, bossX: 0, bossY: 0,
  wobbleT: 0, bossAngle: 0, spiralAngle: 0, shootTimer: 0,
  bullets: [], playerX: 0, playerY: 0, mouseX: -1, mouseY: -1,
  fps: 0, lastFpsTime: 0, fpsFrames: 0, stars: [],
  phaseIdx: 0, mobList: [],

  // 玩家 HP 系統
  playerHp: 100, playerMaxHp: 100, playerInvFrames: 0,
  damageNumbers: [],

  // 玩家射擊
  playerBullets: [], playerShootTimer: 0, mouseDown: false,

  // 方向箭頭拖移
  _arrowDrag: false, _arrowDragPhase: null, _arrowDragKey: null,

  // 強制 Phase
  forcedPhase: -1,
  // 武器預覽
  activeWeaponId: 'pulse_gun',

  init() {
    this.canvas = document.getElementById('preview-canvas');
    this.ctx = this.canvas.getContext('2d');
    this._resize();
    window.addEventListener('resize', () => this._resize());
    this.canvas.addEventListener('mousemove', e => {
      const r = this.canvas.getBoundingClientRect();
      this.mouseX = e.clientX - r.left;
      this.mouseY = e.clientY - r.top;
      if (this._arrowDrag && this._arrowDragPhase) {
        // 計算拖移角度 → dir_offset（相對於發射原點）
        const ox = this._arrowOriginX, oy = this._arrowOriginY;
        const angle = Math.atan2(this.mouseY - oy, this.mouseX - ox);
        const deg = Math.round(angle * 180 / Math.PI);
        this._arrowDragPhase.dir_offset = deg;
        APP.renderTab('enemy_data');
      }
    });
    this.canvas.addEventListener('mousedown', e => {
      const r = this.canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      // 檢查是否點在方向箭頭尖端附近
      if (this._arrowTipX !== undefined) {
        const dx = mx - this._arrowTipX, dy = my - this._arrowTipY;
        if (dx*dx + dy*dy < 400) { this._arrowDrag = true; return; }
      }
      this.mouseDown = true;
    });
    this.canvas.addEventListener('mouseup',    () => { this.mouseDown = false; this._arrowDrag = false; });
    this.canvas.addEventListener('mouseleave', () => { this.mouseDown = false; this._arrowDrag = false; });
  },

  _resize() {
    const p = document.getElementById('preview-panel');
    this.canvas.width  = p.offsetWidth;
    this.canvas.height = p.offsetHeight - 60;
    this.playerX = this.canvas.width / 2;
    this.playerY = this.canvas.height - 60;
    this._initStars();
  },

  _initStars() {
    const cnt = DESIGN.vfx?.bg_stars?.count || 60;
    this.stars = Array.from({length:cnt}, () => ({
      x: Math.random()*this.canvas.width, y: Math.random()*this.canvas.height,
      r: Math.random()*1.2+0.3, speed: Math.random()*0.4+0.1, op: Math.random()*0.5+0.2,
    }));
  },

  loadPoi(poi) {
    this.poi = poi;
    const key = `threat_${poi.threat}`;
    const patterns = DESIGN.patterns[key] || [];
    const hpMult = DESIGN.balance?.difficulty?.enemy_hp_mult || 1.0;
    this.bossHp = this.bossMaxHp = (poi.threat * 600) * hpMult;
    this.bossX = this.canvas.width / 2;
    this.bossY = 70;
    this.wobbleT = 0; this.bossAngle = 0; this.spiralAngle = 0;
    this.shootTimer = 0; this.phaseIdx = 0;
    this.bullets = []; this.playerBullets = []; this.playerShootTimer = 0;
    this.playerHp = this.playerMaxHp = DESIGN.mechanics?.player?.max_hp || 100;
    this.playerInvFrames = 0;
    this.damageNumbers = [];
    this.forcedPhase = -1;
    this._arrowDrag = false; this._arrowDragPhase = null;
    // 初始化小怪列表（mob 模式）
    if (poi.type === 'mob') {
      const count = (DESIGN.mob_counts?.[poi.threat]) ?? poi.mob_count ?? 3;
      const cw = this.canvas.width;
      this.mobList = Array.from({length: count}, (_, i) => ({
        id: i,
        x: (cw / (count + 1)) * (i + 1),
        y: 80 + (Math.floor(i / 4)) * 70,
        wobT: (Math.PI * 2 / count) * i,
        dead: false,
      }));
    } else {
      this.mobList = [];
    }
    if (!this.running) this.start();
    else this.restart();
  },

  toggle() {
    if (this.running) this.stop(); else this.start();
  },

  start() {
    if (!this.poi) { APP.status('請先選擇地點'); return; }
    this.running = true;
    document.querySelector('#preview-title button').textContent = '⏹ 停止';
    this._loop();
  },

  stop() {
    this.running = false;
    if (this.animId) { cancelAnimationFrame(this.animId); this.animId = null; }
    document.querySelector('#preview-title button').textContent = '▶ 開始';
  },

  restart() {
    if (this.poi) this.loadPoi(this.poi);
  },

  _getCurrentPattern() {
    if (!this.poi) return null;
    const key = `threat_${this.poi.threat}`;
    const phases = DESIGN.patterns[key] || [];
    if (!phases.length) return null;

    // 強制 Phase 模式
    if (this.forcedPhase >= 1) {
      return phases.find(p => p.phase === this.forcedPhase) || phases[0];
    }

    const ratio = this.bossHp / this.bossMaxHp;
    let cur = phases[0];
    for (const p of phases) { if (ratio <= p.hp_threshold) cur = p; }
    return cur;
  },

  setForcedPhase(n) {
    this.forcedPhase = n;
    // 強制切換時重置射擊計時器
    this.shootTimer = 0;
    APP.status(n === -1 ? '預覽模式：自動（依 HP）' : `強制預覽 Phase ${n}`);
  },

  _getLaunchOrigin(p) {
    const cw = this.canvas.width, ch = this.canvas.height;
    switch(p.launch_source || 'monster') {
      case 'top':    return { x: this.bossX + (Math.random()-.5)*cw*.6, y: 0 };
      case 'bottom': return { x: this.bossX + (Math.random()-.5)*cw*.6, y: ch };
      case 'left':   return { x: 0,  y: ch * (.2 + Math.random()*.5) };
      case 'right':  return { x: cw, y: ch * (.2 + Math.random()*.5) };
      case 'fixed':  return { x: p.fixed_x || cw/2, y: p.fixed_y || 80 };
      default: {
        if (this.poi?.type === 'mob' && this.mobList.length > 0) {
          const live = this.mobList.filter(m => !m.dead);
          if (live.length) { const m = live[Math.floor(Math.random()*live.length)]; return {x:m.x, y:m.y}; }
        }
        return { x: this.bossX, y: this.bossY };
      }
    }
  },

  _spawnBullets(p) {
    const origin = this._getLaunchOrigin(p);
    const bx = origin.x, by = origin.y;
    const dirRad = ((p.dir_offset || 0) * Math.PI / 180);
    const spdMult = DESIGN.balance?.difficulty?.enemy_speed_mult || 1.0;
    const dmgMult = DESIGN.balance?.difficulty?.enemy_damage_mult || 1.0;
    const spd = p.speed * spdMult;
    const dmg = (p.damage||10) * dmgMult;
    const col = p.color || '#ff1a6e';
    const r   = p.r || 6;
    const traj = p.trajectory || 'straight';
    const bend = p.curve_bend ?? 0.03;

    const mk = (ax,ay,vx,vy,rc,cl,ml,tr) => this.bullets.push({x:ax,y:ay,vx,vy,r:rc,color:cl,life:0,maxLife:ml,damage:dmg,traj:tr,bend,gravity:p.gravity||0.08,bounce:0,maxBounce:2});
    switch(p.type) {
      case 'radial': for(let i=0;i<p.count;i++){const a=(Math.PI*2/p.count)*i+this.bossAngle+dirRad;mk(bx,by,Math.cos(a)*spd,Math.sin(a)*spd,r,col,p.maxLife||260,traj);}; this.bossAngle+=0.22; break;
      case 'spiral': for(let a=0;a<(p.count||3);a++){const angle=this.spiralAngle+(Math.PI*2/(p.count||3))*a+dirRad;mk(bx,by,Math.cos(angle)*spd,Math.sin(angle)*spd,r-1,'#ff6600',p.maxLife||320,traj);}; this.spiralAngle+=0.14; break;
      case 'aimed': {const dx=this.playerX-bx,dy=this.playerY-by,base=Math.atan2(dy,dx)+dirRad,spread=0.22;for(let i=0;i<p.count;i++){const a=base+(i-(p.count-1)/2)*spread;mk(bx,by,Math.cos(a)*spd,Math.sin(a)*spd,r+1,'#ffaa00',p.maxLife||320,traj);} break;}
      case 'wave': for(let i=0;i<p.count;i++){const wx=(this.canvas.width/p.count)*i+this.canvas.width/p.count/2;mk(wx,by+30,(Math.random()-.5)*1.2,spd*(0.8+Math.random()*.4),r,'#aa00ff',p.maxLife||350,'straight');} break;
      case 'chaos': {const roll=Math.random();const cp={...p,type:roll<0.33?'radial':roll<0.66?'spiral':'aimed'};this._spawnBullets(cp);return;}
      default: for(let i=0;i<p.count;i++){const a=(Math.PI*2/p.count)*i+this.bossAngle+dirRad;mk(bx,by,Math.cos(a)*spd,Math.sin(a)*spd,r,col,p.maxLife||400,traj);} this.bossAngle+=0.22; break;
    }
  },

  _loop() {
    if (!this.running) return;
    const cw = this.canvas.width, ch = this.canvas.height;
    const now = performance.now();
    this.fpsFrames++;
    if (now - this.lastFpsTime >= 1000) { this.fps = this.fpsFrames; this.fpsFrames = 0; this.lastFpsTime = now; }

    // 背景
    this.ctx.fillStyle = '#050810';
    this.ctx.fillRect(0, 0, cw, ch);
    this.stars.forEach(s => { s.y += s.speed; if(s.y>ch)s.y=0; this.ctx.fillStyle=`rgba(200,220,255,${s.op})`; this.ctx.beginPath(); this.ctx.arc(s.x,s.y,s.r,0,Math.PI*2); this.ctx.fill(); });

    // ── Boss 移動（每個 Phase 各自的 movement_type）──────────
    const _globalBm = DESIGN.visuals?.boss_movement?.[this.poi?.threat] || { type: 'wobble' };
    const _curPattern = this._getCurrentPattern();
    const bm = (this.poi?.type === 'boss')
      ? { ..._globalBm, type: _curPattern?.movement_type || _globalBm.type }
      : { type: 'static' };

    switch (bm.type) {
      case 'circular': {
        this.wobbleT += bm.speed || 0.022;
        const or = bm.orbit_r || 80;
        this.bossX = cw / 2 + Math.cos(this.wobbleT) * or;
        this.bossY = ch * 0.22 + Math.sin(this.wobbleT) * or * 0.45;
        break;
      }
      case 'figure8': {
        this.wobbleT += bm.speed || 0.022;
        const sc = bm.scale || 80;
        this.bossX = cw / 2 + Math.sin(this.wobbleT) * sc;
        this.bossY = ch * 0.22 + Math.sin(this.wobbleT * 2) * sc * 0.4;
        break;
      }
      case 'track_player_x': {
        const lag = bm.lag || 0.05;
        this.bossX += (this.playerX - this.bossX) * lag;
        this.wobbleT += 0.018;
        this.bossY = 70 + Math.sin(this.wobbleT) * 12;
        break;
      }
      case 'static':
        this.bossX = cw / 2;
        this.bossY = 70;
        break;
      default: // wobble
        this.wobbleT += 0.018;
        this.bossX = cw / 2 + Math.sin(this.wobbleT * 0.7) * 40;
        this.bossY = 70 + Math.sin(this.wobbleT) * 18;
    }

    // ── Boss 射擊 ────────────────────────────────────────────
    const p = this._getCurrentPattern();
    if (p && this.bossHp > 0) {
      const interval = (p.fire_interval || Math.max(14, 55 - (this.poi?.threat||1)*7));
      this.shootTimer++;
      if (this.shootTimer >= interval) { this.shootTimer = 0; this._spawnBullets(p); }
    }

    // ── 更新子彈 + 玩家碰撞偵測 ─────────────────────────────
    const visuals = DESIGN.visuals;
    const invFrm  = DESIGN.mechanics?.player?.inv_frames || 90;
    const pRadius = DESIGN.mechanics?.player?.player_radius || 8;
    if (this.playerInvFrames > 0) this.playerInvFrames--;

    this.bullets = this.bullets.filter(b => {
      b.life++;
      if (b.traj === 'parabola') b.vy += (b.gravity || 0.08);
      if (b.traj === 'curve') { const angle = Math.atan2(b.vy,b.vx) + (b.bend??0.03); const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy); b.vx=Math.cos(angle)*spd; b.vy=Math.sin(angle)*spd; }
      if (b.traj === 'homing') { const dx=this.playerX-b.x,dy=this.playerY-b.y,dist=Math.sqrt(dx*dx+dy*dy); if(dist>0){b.vx+=(dx/dist)*.3;b.vy+=(dy/dist)*.3;const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(spd>8){b.vx=b.vx/spd*8;b.vy=b.vy/spd*8;}} }
      if (b.traj === 'bounce') {

      }

      if (this.playerInvFrames === 0) {
        const dx = b.x - this.playerX, dy = b.y - this.playerY;
        if (dx*dx + dy*dy < (pRadius + b.r) ** 2) {
          const dmg = Math.round(b.damage || 10);
          this.playerHp = Math.max(0, this.playerHp - dmg);
          this.playerInvFrames = invFrm;
          this.damageNumbers.push({ x: this.playerX, y: this.playerY - 20, val: dmg, life: 0, maxLife: 45 });
          return false;
        }
      }

      return b.life < b.maxLife && b.x > -40 && b.x < cw+40 && b.y > -40 && b.y < ch+40;
    });

    // 渲染子彈
    for (const b of this.bullets) {
      this.ctx.save();
      this.ctx.shadowBlur = b.r*4; this.ctx.shadowColor = b.color;
      this.ctx.fillStyle = b.color;
      this.ctx.beginPath(); this.ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); this.ctx.fill();
      this.ctx.globalAlpha = 0.28;
      this.ctx.beginPath(); this.ctx.arc(b.x-b.vx*2.5, b.y-b.vy*2.5, b.r*0.65, 0, Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    }

    // 渲染小怪（mob 模式）
    if (this.poi?.type === 'mob' && this.mobList.length > 0) {
      const t   = this.poi.threat;
      const mv  = DESIGN.visuals.mob[t] || {};
      const col = mv.primary_color || '#ff6b35';
      const glow= mv.glow_intensity || 24;
      this.mobList.forEach(m => {
        if (m.dead) return;
        m.wobT = (m.wobT || 0) + 0.022;

        // 位置更新（grid + 擺動）
        const count = this.mobList.length;
        const cols  = Math.ceil(Math.sqrt(count));
        const col_i = m.id % cols;
        const row_i = Math.floor(m.id / cols);
        m.x = (cw / (cols + 1)) * (col_i + 1) + Math.sin(m.wobT + col_i) * 35;
        m.y = 70 + row_i * 70 + Math.cos(m.wobT * 0.8) * 18;

        // 小怪射擊（瞄準玩家）
        m.shootTimer = (m.shootTimer || Math.floor(m.id * 20)) + 1;
        const mobInterval = Math.max(50, 110 - t * 10);
        if (m.shootTimer >= mobInterval) {
          m.shootTimer = 0;
          const dx = this.playerX - m.x, dy = this.playerY - m.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist > 0) {
            const spd = (3 + t * 0.6) * (DESIGN.balance?.difficulty?.enemy_speed_mult || 1);
            const dmg = (7 + t * 2) * (DESIGN.balance?.difficulty?.enemy_damage_mult || 1);
            const spread = t >= 3 ? [-0.18, 0, 0.18] : [0];
            spread.forEach(off => {
              const base = Math.atan2(dy, dx) + off;
              this.bullets.push({ x:m.x, y:m.y, vx:Math.cos(base)*spd, vy:Math.sin(base)*spd, r:5, color:col, life:0, maxLife:280, damage:dmg, traj:'straight', bounce:0, maxBounce:0 });
            });
          }
        }

        const r = (10 + t * 3) * (mv.size_multiplier || 1.0);
        this.ctx.save();
        this.ctx.shadowBlur = glow; this.ctx.shadowColor = col;
        this.ctx.strokeStyle = col; this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        const shape = mv.shape || 'hexagon';
        const sides = {hexagon:6, square:4, triangle:3, circle:0, star:10}[shape] || 6;
        if (shape === 'circle') { this.ctx.arc(m.x, m.y, r, 0, Math.PI*2); }
        else if (shape === 'star') {
          for(let i=0;i<10;i++){const a=(Math.PI*2/10)*i-Math.PI/2,rv=i%2===0?r:r*.42;i===0?this.ctx.moveTo(m.x+Math.cos(a)*rv,m.y+Math.sin(a)*rv):this.ctx.lineTo(m.x+Math.cos(a)*rv,m.y+Math.sin(a)*rv);}
        } else {
          for(let i=0;i<sides;i++){const a=(Math.PI*2/sides)*i+m.wobT*.4;i===0?this.ctx.moveTo(m.x+Math.cos(a)*r,m.y+Math.sin(a)*r):this.ctx.lineTo(m.x+Math.cos(a)*r,m.y+Math.sin(a)*r);}
        }
        this.ctx.closePath();
        const rgb = col.startsWith('#') ? `${parseInt(col.slice(1,3),16)},${parseInt(col.slice(3,5),16)},${parseInt(col.slice(5,7),16)}` : '255,107,53';
        this.ctx.fillStyle = `rgba(${rgb},.18)`; this.ctx.fill(); this.ctx.stroke();
        this.ctx.fillStyle = `hsl(40,100%,60%)`; this.ctx.shadowBlur = 8; this.ctx.shadowColor = col;
        this.ctx.beginPath(); this.ctx.arc(m.x, m.y, r*.35, 0, Math.PI*2); this.ctx.fill();
        this.ctx.restore();
        // 子形狀
        (mv.sub_shapes||[]).forEach(ss => {
          const sx = m.x + (ss.offset_x||0), sy = m.y + (ss.offset_y||0);
          const sr = r * (ss.size_mult||0.4);
          const sc2 = ss.color || col;
          this.ctx.save();
          this.ctx.shadowBlur = ss.glow_intensity||16; this.ctx.shadowColor = sc2;
          this.ctx.fillStyle = sc2; this.ctx.beginPath();
          const ssShape = ss.shape || 'circle';
          if (ssShape==='circle') { this.ctx.arc(sx,sy,sr,0,Math.PI*2); }
          else { const sides={pentagon:5,hexagon:6,square:4,triangle:3,star:10,diamond:4}[ssShape]||4; for(let i=0;i<sides;i++){const a=(Math.PI*2/sides)*i-Math.PI/2;i===0?this.ctx.moveTo(sx+Math.cos(a)*sr,sy+Math.sin(a)*sr):this.ctx.lineTo(sx+Math.cos(a)*sr,sy+Math.sin(a)*sr);} }
          this.ctx.closePath(); this.ctx.fill(); this.ctx.restore();
        });
      });
      // 計數 HUD
      const alive = this.mobList.filter(m => !m.dead).length;
      const bw=Math.min(cw*.5,280),bx2=(cw-bw)/2;
      this.ctx.fillStyle='rgba(0,0,0,.6)'; this.ctx.fillRect(bx2,8,bw,14);
      this.ctx.fillStyle=`rgba(255,107,53,.7)`; this.ctx.fillRect(bx2+1,9,(bw-2)*(alive/this.mobList.length),12);
      this.ctx.strokeStyle='rgba(255,107,53,.5)'; this.ctx.lineWidth=1; this.ctx.strokeRect(bx2,8,bw,14);
      this.ctx.fillStyle='#ff6b35'; this.ctx.font='9px monospace'; this.ctx.textAlign='center';
      this.ctx.fillText(`${this.poi.name} — 小怪 ${alive}/${this.mobList.length}`, cw/2, 20); this.ctx.textAlign='left';
      document.getElementById('pv-hp').textContent = `小怪: ${alive}/${this.mobList.length}`;
    }

    // 渲染 Boss（boss 模式）
    if (this.poi?.type === 'boss' && this.bossHp > 0) {
      const t = this.poi.threat;
      const bv = visuals.boss[t] || {};
      const r = (28 + t*7) * (bv.size_multiplier||1.0);
      const col = bv.primary_color || '#ff1a6e';
      const glow = bv.glow_intensity || 50;
      const shape = bv.shape || 'diamond';
      const hpRatio = this.bossHp / this.bossMaxHp;
      this.ctx.save();
      this.ctx.shadowBlur = glow; this.ctx.shadowColor = col;
      // 旋轉光環
      const spokeCount = bv.spoke_count !== undefined ? bv.spoke_count : 6;
      if (spokeCount > 0) {
        this.ctx.save(); this.ctx.translate(this.bossX, this.bossY); this.ctx.rotate(this.wobbleT*0.5);
        this.ctx.strokeStyle = `rgba(${parseInt(col.slice(1,3),16)},${parseInt(col.slice(3,5),16)},${parseInt(col.slice(5,7),16)},0.4)`;
        this.ctx.lineWidth = 2;
        for(let i=0;i<spokeCount;i++){const a=(Math.PI*2/spokeCount)*i;this.ctx.beginPath();this.ctx.moveTo(Math.cos(a)*(r+8),Math.sin(a)*(r+8));this.ctx.lineTo(Math.cos(a)*(r+22),Math.sin(a)*(r+22));this.ctx.stroke();}
        this.ctx.restore();
      }
      // 主體
      this.ctx.fillStyle = col;
      this.ctx.beginPath();
      if (shape==='diamond'){this.ctx.moveTo(this.bossX,this.bossY-r);this.ctx.lineTo(this.bossX+r*.65,this.bossY);this.ctx.lineTo(this.bossX,this.bossY+r);this.ctx.lineTo(this.bossX-r*.65,this.bossY);}
      else if(shape==='circle'){this.ctx.arc(this.bossX,this.bossY,r,0,Math.PI*2);}
      else if(shape==='pentagon'){for(let i=0;i<5;i++){const a=(Math.PI*2/5)*i-Math.PI/2;i===0?this.ctx.moveTo(this.bossX+Math.cos(a)*r,this.bossY+Math.sin(a)*r):this.ctx.lineTo(this.bossX+Math.cos(a)*r,this.bossY+Math.sin(a)*r);}}
      else if(shape==='star'){for(let i=0;i<10;i++){const a=(Math.PI*2/10)*i-Math.PI/2,rv=i%2===0?r:r*0.4;i===0?this.ctx.moveTo(this.bossX+Math.cos(a)*rv,this.bossY+Math.sin(a)*rv):this.ctx.lineTo(this.bossX+Math.cos(a)*rv,this.bossY+Math.sin(a)*rv);}}

        const sx = this.bossX + (ss.offset_x||0), sy = this.bossY + (ss.offset_y||0);

        this.ctx.shadowBlur = ss.glow_intensity||20; this.ctx.shadowColor = sc2;
        this.ctx.fillStyle = sc2;
        this.ctx.beginPath();
        const ssShape = ss.shape || 'circle';
        if (ssShape==='circle') { this.ctx.arc(sx, sy, sr, 0, Math.PI*2); }
        else if (ssShape==='diamond') { this.ctx.moveTo(sx,sy-sr);this.ctx.lineTo(sx+sr*.65,sy);this.ctx.lineTo(sx,sy+sr);this.ctx.lineTo(sx-sr*.65,sy); }
        else { const sides={pentagon:5,hexagon:6,square:4,triangle:3,star:10,cross:4}[ssShape]||5; for(let i=0;i<sides;i++){const a=(Math.PI*2/sides)*i-Math.PI/2;i===0?this.ctx.moveTo(sx+Math.cos(a)*sr,sy+Math.sin(a)*sr):this.ctx.lineTo(sx+Math.cos(a)*sr,sy+Math.sin(a)*sr);} }
        this.ctx.closePath(); this.ctx.fill();

        if ((ss.spoke_count||0) > 0) {
          this.ctx.strokeStyle = sc2; this.ctx.lineWidth = 1.5;
          for(let i=0;i<ss.spoke_count;i++){const a=(Math.PI*2/ss.spoke_count)*i;this.ctx.beginPath();this.ctx.moveTo(sx+Math.cos(a)*(sr+4),sy+Math.sin(a)*(sr+4));this.ctx.lineTo(sx+Math.cos(a)*(sr+14),sy+Math.sin(a)*(sr+14));this.ctx.stroke();}
        }
        this.ctx.restore();

      // 核心

      this.ctx.fillStyle = ic; this.ctx.shadowBlur=20; this.ctx.shadowColor=ic;
      this.ctx.beginPath(); this.ctx.arc(this.bossX, this.bossY, r*.3, 0, Math.PI*2); this.ctx.fill();
      this.ctx.fillStyle='#fff'; this.ctx.beginPath(); this.ctx.arc(this.bossX,this.bossY,r*.1,0,Math.PI*2); this.ctx.fill();

      this.ctx.strokeStyle='rgba(255,26,110,.5)'; this.ctx.lineWidth=1; this.ctx.strokeRect(bx2,8,bw,14);
      this.ctx.fillStyle='#ff1a6e'; this.ctx.font='9px monospace'; this.ctx.textAlign='center';
      this.ctx.fillText(this.poi.name, cw/2, 20); this.ctx.textAlign='left';
      this.ctx.restore();
    }

    // ── 玩家 — XY 自由移動 ──────────────────────────────────
    const smooth = DESIGN.mechanics?.player?.move_smoothing || 0.14;
    if (this.mouseX >= 0) this.playerX += (this.mouseX - this.playerX) * smooth;
    if (this.mouseY >= 0) this.playerY += (this.mouseY - this.playerY) * smooth;
    this.playerX = Math.max(16, Math.min(cw-16, this.playerX));
    this.playerY = Math.max(ch * 0.2, Math.min(ch - 30, this.playerY));

    const showPlayer = !(this.playerInvFrames > 0 && Math.floor(this.playerInvFrames / 5) % 2 === 0);
    if (showPlayer) {

      this.ctx.lineTo(this.playerX, this.playerY+7);
      this.ctx.lineTo(this.playerX+4, this.playerY+4);
      this.ctx.lineTo(this.playerX+11, this.playerY+10);
      this.ctx.closePath(); this.ctx.fill();
      this.ctx.fillStyle='rgba(0,20,40,.6)'; this.ctx.beginPath(); this.ctx.moveTo(this.playerX,this.playerY-8); this.ctx.lineTo(this.playerX-5,this.playerY+5); this.ctx.lineTo(this.playerX+5,this.playerY+5); this.ctx.closePath(); this.ctx.fill();
      this.ctx.fillStyle='#fff'; this.ctx.shadowBlur=8; this.ctx.shadowColor='#fff'; this.ctx.beginPath(); this.ctx.arc(this.playerX,this.playerY-2,2.5,0,Math.PI*2); this.ctx.fill();
      this.ctx.restore();
    }

    // ── 玩家射擊（使用選中武器屬性）─────────────────────────────
    const _wpn = DESIGN.weapons?.[this.activeWeaponId] || DESIGN.weapons?.['pulse_gun'] || {};
    const pFireRate = _wpn.fire_rate ?? DESIGN.mechanics?.player?.fire_rate ?? 7;
    const pAtk = (DESIGN.mechanics?.player?.base_atk || 12);
    const pBulletSpd = 12 * (DESIGN.mechanics?.player?.bullet_speed_mult || 1.0);
    const pBColor = _wpn.color || '#00f0ff';
    const pBR = _wpn.bullet_r || 4;
    if (this.mouseDown) {
      this.playerShootTimer++;
      if (this.playerShootTimer >= pFireRate) {
        this.playerShootTimer = 0;
        this.playerBullets.push({ x: this.playerX, y: this.playerY - 16, vx: 0, vy: -pBulletSpd, r: pBR, color: pBColor, damage: pAtk, life: 0, maxLife: 120 });
      }
    }
    // 更新玩家子彈 + 碰撞 boss/mob
    this.playerBullets = this.playerBullets.filter(pb => {
      pb.x += pb.vx; pb.y += pb.vy; pb.life++;
      if (pb.life >= pb.maxLife || pb.y < -20) return false;
      // 碰撞 Boss
      if (this.poi?.type === 'boss' && this.bossHp > 0) {
        const bossR = (28 + (this.poi.threat||1)*7) * (DESIGN.visuals?.boss?.[this.poi.threat]?.size_multiplier||1);
        const dx = pb.x - this.bossX, dy = pb.y - this.bossY;
        if (dx*dx + dy*dy < (bossR + pb.r)**2) {
          this.bossHp = Math.max(0, this.bossHp - pb.damage);
          this.damageNumbers.push({ x: this.bossX + (Math.random()-.5)*30, y: this.bossY - 20, val: pb.damage, life: 0, maxLife: 40 });
          document.getElementById('pv-hp').textContent = `Boss HP: ${Math.round(this.bossHp)}/${this.bossMaxHp}`;
          return false;
        }
      }
      // 碰撞小怪
      if (this.poi?.type === 'mob') {
        for (const m of this.mobList) {
          if (m.dead) continue;
          const t = this.poi.threat;
          const mr = (10 + t*3) * (DESIGN.visuals?.mob?.[t]?.size_multiplier||1);
          const dx = pb.x - m.x, dy = pb.y - m.y;
          if (dx*dx + dy*dy < (mr + pb.r)**2) {

            this.damageNumbers.push({ x: m.x, y: m.y - 16, val: pb.damage, life: 0, maxLife: 40 });
            return false;
          }
        }
      }
      // 渲染玩家子彈
      this.ctx.save();
      const _pc = pb.color || '#00f0ff';
      this.ctx.shadowBlur = 10; this.ctx.shadowColor = _pc;
      this.ctx.fillStyle = _pc;
      this.ctx.beginPath(); this.ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2); this.ctx.fill();
      this.ctx.restore();
      return true;
    });

    // ── 方向箭頭（pattern tab 時顯示）───────────────────────
    if (currentTab === 'enemy_data') {
      const curP = this._getCurrentPattern();
      if (curP) {
        const origin = this._getLaunchOrigin(curP);
        const ox = origin.x, oy = origin.y;
        const dirRad = ((curP.dir_offset||0) + 270) * Math.PI / 180; // 預設向上
        const arrowLen = 50;
        const tipX = ox + Math.cos(dirRad) * arrowLen;
        const tipY = oy + Math.sin(dirRad) * arrowLen;
        this._arrowTipX = tipX; this._arrowTipY = tipY;
        this._arrowOriginX = ox; this._arrowOriginY = oy;

        this.ctx.beginPath(); this.ctx.moveTo(ox, oy); this.ctx.lineTo(tipX, tipY); this.ctx.stroke();

    // ── 玩家 HP 條 ───────────────────────────────────────────
    const phRatio = this.playerHp / this.playerMaxHp;
    this.ctx.fillStyle = 'rgba(0,0,0,.7)';
    this.ctx.fillRect(10, ch - 28, 150, 14);

    this.ctx.fillStyle = '#c8deff'; this.ctx.font = '9px monospace'; this.ctx.textAlign = 'left';
    this.ctx.fillText(`HP ${this.playerHp}/${this.playerMaxHp}`, 14, ch - 16);

    // ── 傷害數字 ─────────────────────────────────────────────
    this.damageNumbers = this.damageNumbers.filter(dn => dn.life < dn.maxLife);
    for (const dn of this.damageNumbers) {
      const t = 1 - dn.life / dn.maxLife;

      dn.life++;
    }

    // ── HUD 資訊 ─────────────────────────────────────────────
    const curPhase = this._getCurrentPattern()?.phase ?? '—';
    document.getElementById('pv-fps').textContent     = `FPS: ${this.fps}`;
    document.getElementById('pv-bullets').textContent = `子彈: ${this.bullets.length}  Phase:${curPhase}`;
    document.getElementById('pv-hp').textContent      =
      this.poi?.type === 'boss'
        ? `Boss HP: ${Math.round(this.bossHp)}/${this.bossMaxHp}`
        : `小怪: ${this.mobList.filter(m=>!m.dead).length}/${this.mobList.length}`;

    // ── 勝負判定 ────────────────────────────────────────────
    const bossDefeated = this.poi?.type === 'boss' && this.bossHp <= 0;
    const mobsDefeated = this.poi?.type === 'mob'  && this.mobList.length > 0 && this.mobList.every(m => m.dead);
    if (bossDefeated || mobsDefeated) {
      this.ctx.fillStyle = 'rgba(0,0,0,.7)';
      this.ctx.fillRect(0, 0, cw, ch);
      this.ctx.textAlign = 'center';
      this.ctx.shadowBlur = 24; this.ctx.shadowColor = '#00ff88';
      this.ctx.fillStyle = '#00ff88'; this.ctx.font = 'bold 28px monospace';
      this.ctx.fillText('✓ 擊敗！', cw/2, ch/2 - 10);
      this.ctx.shadowBlur = 0; this.ctx.fillStyle = 'rgba(180,200,220,.7)';
      this.ctx.font = '11px monospace';
      this.ctx.fillText('3 秒後重新開始...', cw/2, ch/2 + 16);
      this.ctx.textAlign = 'left';
      if (!this._endScheduled) {
        this._endScheduled = true;
        setTimeout(() => { this._endScheduled = false; this.loadPoi(this.poi); }, 3000);
      }
    }
    // 玩家 HP ≤ 0 → 自動復活，不跳死亡畫面
    if (this.playerHp <= 0) {
      this.playerHp = this.playerMaxHp;
      this.playerInvFrames = DESIGN.mechanics?.player?.inv_frames || 90;
      this.damageNumbers.push({ x: this.playerX, y: this.playerY - 30, val: '復活', life: 0, maxLife: 60 });
    }

    this.animId = requestAnimationFrame(() => this._loop());
  },
};

// ═══════════════════════════════════════════════════════════════
//  啟動
// ═══════════════════════════════════════════════════════════════
window.addEventListener('load', () => APP.init());
</script>
